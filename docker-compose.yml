services:

  # Servicio 1: Base de datos PostgreSQL
  db:
    image: postgres:15
    container_name: demo-db
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Servicio 2: Tu aplicación Spring Boot
  app:
    build: .
    container_name: demo-app
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
