<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Proyecto Académico</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- EFECTOS HOVER PERSONALIZADOS -->
    <style>
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        /* Efecto cuando el mouse pasa sobre la tarjeta */
        .card:hover {
            transform: translateY(-8px); /* Eleva la tarjeta 8 píxeles hacia arriba */
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.15) !important; /* Acentúa la sombra */
        }
        /* Efecto de zoom suave en el avatar */
        .card img {
            transition: transform 0.3s ease;
        }
        .card:hover img {
            transform: scale(1.05); /* Agranda ligeramente la imagen del avatar */
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Sistema de Usuarios</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="rickandmorty.html">🚀 Rick and Morty API</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-4">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h1 class="fw-bold text-primary">Gestión de Usuarios</h1>
                <p class="text-muted">Panel de control conectado a Spring Boot y PostgreSQL</p>
            </div>
        </div>

        <!-- Sección de controles (Buscador y Botón Nuevo Usuario) -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-8 mb-2 mb-md-0">
                <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar usuario por nombre...">
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-success fw-bold w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    + Nuevo Usuario
                </button>
            </div>
        </div>

        <!-- Galería de Tarjetas de Usuarios -->
        <div id="contenedor-tarjetas" class="row g-4">
            <!-- Las tarjetas se cargarán dinámicamente con JavaScript -->
            <div class="col-12 text-center text-muted py-5">
                <p>Cargando usuarios o base de datos vacía...</p>
            </div>
        </div>
    </main>

    <!-- Modal para Crear / Editar Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <input type="hidden" id="usuarioId">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" id="telefono" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL del Avatar (Imagen)</label>
                            <input type="text" id="avatar" class="form-control" placeholder="https://ejemplo.com/foto.jpg">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Biografía o Descripción</label>
                            <textarea id="bio" class="form-control" rows="2" placeholder="Breve descripción..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Comida Favorita</label>
                            <input type="text" id="comidaFavorita" class="form-control" placeholder="Ej. Pizza, Seco de gallina...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pasatiempos e Intereses</label>
                            <input type="text" id="pasatiempos" class="form-control" placeholder="Ej. Ajedrez, Programación...">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Vista Detallada de la Tarjeta -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Detalles del Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <img id="detalle-avatar" src="" class="rounded-circle shadow mb-3" style="width: 130px; height: 130px; object-fit: cover;" alt="Avatar Detallado">
                    <h3 id="detalle-nombre" class="fw-bold text-dark mb-1"></h3>
                    <p id="detalle-email" class="text-muted small mb-3"></p>
                    
                    <hr>
                    
                    <div class="text-start px-3">
                        <p class="mb-2"><strong>📞 Teléfono:</strong> <span id="detalle-telefono" class="text-secondary"></span></p>
                        <p class="mb-2"><strong>📖 Biografía:</strong> <span id="detalle-bio" class="text-secondary"></span></p>
                        <p class="mb-2"><strong>🍽️ Comida Favorita:</strong> <span id="detalle-comida" class="text-secondary"></span></p>
                        <p class="mb-0"><strong>🎮 Pasatiempos:</strong> <span id="detalle-pasatiempos" class="text-secondary"></span></p>
                    </div>
                </div>
                <div class="modal-footer bg-light justify-content-center">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Enlace a nuestro script de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
