<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Proyecto Académico</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Sistema de Usuarios</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="rickandmorty.html">🚀 Rick and Morty API</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-4">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h1 class="fw-bold text-primary">Gestión de Usuarios</h1>
                <p class="text-muted">Panel de control conectado a Spring Boot y PostgreSQL</p>
            </div>
        </div>

        <!-- Sección de controles (Buscador y Botón Nuevo Usuario) -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-8 mb-2 mb-md-0">
                <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar usuario por nombre...">
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-success fw-bold w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    + Nuevo Usuario
                </button>
            </div>
        </div>

        <!-- Galería de Tarjetas de Usuarios -->
        <div id="contenedor-tarjetas" class="row g-4">
            <!-- Las tarjetas se cargarán dinámicamente con JavaScript -->
            <div class="col-12 text-center text-muted py-5">
                <p>Cargando usuarios o base de datos vacía...</p>
            </div>
        </div>
    </main>

    <!-- Modal para Crear / Editar Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <input type="hidden" id="usuarioId">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" id="telefono" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL del Avatar (Imagen)</label>
                            <input type="text" id="avatar" class="form-control" placeholder="https://ejemplo.com/foto.jpg">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Enlace a nuestro script de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
