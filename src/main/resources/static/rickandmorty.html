<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Rick and Morty - API</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html">Wubba Lubba Dub Dub! </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">← Volver a Usuarios</a>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="row text-center mb-4">
            <div class="col-12">
                <h1 class="fw-bold text-success">Explorador de Rick and Morty</h1>
                <p class="text-secondary">Consumiendo endpoints públicos de personajes, ubicaciones y episodios</p>
            </div>
        </div>

        <!-- Pestañas de Navegación (Tabs) -->
        <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="btn-personajes" data-section="character">Personajes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-light" id="btn-ubicaciones" data-section="location">Ubicaciones</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-light" id="btn-episodios" data-section="episode">Episodios</button>
            </li>
        </ul>

        <!-- Buscador con Debounce -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="buscador-api" class="form-control bg-secondary text-light border-0" placeholder="🔍 Buscar (espera 4 segundos tras escribir)...">
            </div>
        </div>

        <!-- Contenedor dinámico de resultados -->
        <div id="contenedor-api" class="row g-4">
            <div class="col-12 text-center text-muted py-5">
                <p>Cargando datos desde la API oficial...</p>
            </div>
        </div>

        <!-- Paginación -->
        <div class="row my-5">
            <div class="col-12 d-flex justify-content-center gap-3">
                <button id="btn-anterior" class="btn btn-outline-success btn-sm px-4" disabled>Anterior</button>
                <span id="info-pagina" class="align-self-center text-secondary">Página 1</span>
                <button id="btn-siguiente" class="btn btn-outline-success btn-sm px-4">Siguiente</button>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de la API -->
    <script src="rickandmorty.js"></script>
</body>
</html>
